<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mis trabajos de InfoVis</title>
<h2 style="color: skyblue;">ITBA - GOÑI LUIS G.</h2>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 1000px;
      margin: 0 auto;
      padding: 20px;
    }

    .grafico {
      width: 90%;          
      max-width: 900px;
      margin: 40px auto;   
    }

    .grafico object,
    .grafico iframe,
    .grafico img,
    .grafico .flourish-embed {
      width: 100%;
      display: block;
    }

    object {
      height: 600px;       
    }
  </style>
</head>
<body>

  <h1>RAWGraphs:</h1>
  <div class="grafico">
    <object type="image/svg+xml" data="./horizon_chart(1).svg"></object>
  </div>

  <h1>Nightingale Chart:</h1>
  <div class="grafico">
    <div class="flourish-embed flourish-chart" data-src="visualisation/27939052">
      <script src="https://public.flourish.studio/resources/embed.js"></script>
      <noscript>
        <img src="https://public.flourish.studio/visualisation/27939052/thumbnail" alt="visualization">
      </noscript>
    </div>
  </div>

  <h1>Data Wrapper - Gráfico de Rangos:</h1>
  <div class="grafico">
    <iframe
      title="Men like spicy or meaty toppings, while women prefer vegetarian options."
      aria-label="Gráfico de rangos"
      id="datawrapper-chart-idhjp"
      src="https://datawrapper.dwcdn.net/idhjp/1/"
      scrolling="no"
      frameborder="0"
      style="border: none;"
      height="480"
      data-external="1">
    </iframe>
  </div>

  <script>
    window.addEventListener("message", function(a) {
      if (a.data["datawrapper-height"]) {
        var iframes = document.querySelectorAll("iframe");
        for (var chartId in a.data["datawrapper-height"]) {
          for (var i = 0; i < iframes.length; i++) {
            if (iframes[i].contentWindow === a.source) {
              iframes[i].style.height = a.data["datawrapper-height"][chartId] + "px";
            }
          }
        }
      }
    });
  </script>

</body>
</html>
